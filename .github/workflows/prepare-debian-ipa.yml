
name: Prepare Debian IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect Debian artifact and Xcode project
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout LinPad
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show Xcode schemes
        run: |
          xcodebuild -list -project iSH.xcodeproj

      - name: Inspect root filesystem configuration
        run: |
          echo "=== ROOTFS_URL references ==="
          grep -n -C 4 'ROOTFS_URL' iSH.xcodeproj/project.pbxproj || true

          echo "=== Download Root build phases ==="
          grep -n -C 8 'Download Root' iSH.xcodeproj/project.pbxproj || true

          echo "=== Bundle identifiers ==="
          grep -n -C 2 'PRODUCT_BUNDLE_IDENTIFIER' iSH.xcodeproj/project.pbxproj || true

      - name: Check signing workflow secrets exist
        env:
          P12: ${{ secrets.LINPAD_P12_BASE64 }}
          PROFILE: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          test -n "$P12" || {
            echo "Signing certificate secret is missing"
            exit 1
          }
          test -n "$PROFILE" || {
            echo "Provisioning profile secret is missing"
            exit 1
          }
          echo "Signing secrets are present."

      - name: Check app signing compatibility
        env:
          PROFILE_B64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/profile-check"
          echo "$PROFILE_B64" | base64 -D \
            > "$RUNNER_TEMP/profile-check/profile.mobileprovision"

          security cms -D \
            -i "$RUNNER_TEMP/profile-check/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile-check/profile.plist"

          echo "=== Profile application identifier ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$RUNNER_TEMP/profile-check/profile.plist"

          echo "=== Profile expiration ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :ExpirationDate' \
            "$RUNNER_TEMP/profile-check/profile.plist"

          echo "=== ARM64 app build settings ==="
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings 2>/dev/null |
            grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|ROOT_BUNDLE_IDENTIFIER|ROOTFS_URL|CODE_SIGN_ENTITLEMENTS) =' |
            sort -u
      - name: Inspect profile entitlements
        run: |
          echo "=== Team identifier ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.team-identifier' \
            "$RUNNER_TEMP/profile-check/profile.plist" || true

          echo "=== App groups ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.security.application-groups' \
            "$RUNNER_TEMP/profile-check/profile.plist" || true

          echo "=== Profile type ==="
          /usr/libexec/PlistBuddy \
            -c 'Print :ProvisionedDevices' \
            "$RUNNER_TEMP/profile-check/profile.plist" || true
          - name: Check ARM64 target identifiers
            run: |
          xcodebuild \
            -project iSH.xcodeproj \
            -target iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings 2>/dev/null |
            grep -E '^[[:space:]]*(PRODUCT_BUNDLE_IDENTIFIER|PRODUCT_NAME|ROOT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM) =' |
            sort -u
      - name: Check root filesystem build workflow
        run: |
          echo "Workflow files:"
          ls .github/workflows
          echo "Root filesystem scripts:"
          ls release

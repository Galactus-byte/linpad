
name: Prepare Debian IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect Debian artifact and Xcode project
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout LinPad
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Show Xcode schemes
        run: |
          xcodebuild -list -project iSH.xcodeproj

      - name: Check signing workflow secrets exist
        env:
          P12: ${{ secrets.LINPAD_P12_BASE64 }}
          PROFILE: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          test -n "$P12" || {
            echo "Signing certificate secret is missing"
            exit 1
          }
          test -n "$PROFILE" || {
            echo "Provisioning profile secret is missing"
            exit 1
          }
          echo "Signing secrets are present."

      - name: Check root filesystem build workflow
        run: |
          echo "Workflow files:"
          ls .github/workflows
          echo "Root filesystem scripts:"
          ls release

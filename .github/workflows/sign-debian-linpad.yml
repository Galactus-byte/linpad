name: Check LinPad Signing Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-signing:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}

        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$CERTIFICATE" "$PROFILE" "$PROFILE_PLIST"
          }
          trap cleanup EXIT

          echo "Checking that GitHub Secrets are present..."

          if [ -z "$P12_BASE64" ]; then
            echo "ERROR: LINPAD_P12_BASE64 is empty."
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERROR: LINPAD_P12_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$PROFILE_BASE64" ]; then
            echo "ERROR: LINPAD_PROVISION_PROFILE_BASE64 is empty."
            exit 1
          fi

          echo "Decoding certificate..."
          printf '%s' "$P12_BASE64" \
            | base64 -D -o "$CERTIFICATE"

          echo "Decoding provisioning profile..."
          printf '%s' "$PROFILE_BASE64" \
            | base64 -D -o "$PROFILE"

          echo
          echo "Checking decoded certificate size..."
          wc -c "$CERTIFICATE"

          echo "Checking decoded certificate SHA-256..."
          shasum -a 256 "$CERTIFICATE"

          echo
          echo "Checking decoded provisioning profile size..."
          wc -c "$PROFILE"

          echo
          echo "Validating PKCS#12 certificate..."
          openssl pkcs12 \
            -in "$CERTIFICATE" \
            -passin env:P12_PASSWORD \
            -info \
            -noout

          echo
          echo "Creating temporary keychain..."
          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo
          echo "Importing certificate into keychain..."
          security import "$CERTIFICATE" \
            -P "$P12_PASSWORD" \
            -k "$KEYCHAIN" \
            -T /usr/bin/codesign

          echo
          echo "Checking code-signing identities..."
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo
          echo "Validating provisioning profile..."
          security cms -D \
            -i "$PROFILE" \
            -o "$PROFILE_PLIST"

          echo
          echo "Checking provisioning profile app identifier..."
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$PROFILE_PLIST"

          echo
          echo "Checking provisioning profile team..."
          /usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' \
            "$PROFILE_PLIST"

          echo
          echo "Checking whether the profile includes a device list..."
          /usr/libexec/PlistBuddy \
            -c 'Print :ProvisionedDevices' \
            "$PROFILE_PLIST" >/dev/null

          echo
          echo "SUCCESS: Certificate and provisioning profile checks passed."

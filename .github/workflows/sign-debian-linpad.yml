name: Check LinPad Signing Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-signing:
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 10

    steps:
      - name: Check signing secrets
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE="$RUNNER_TEMP/certificate.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          cleanup() {
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            rm -f "$CERTIFICATE" "$PROFILE" "$PROFILE_PLIST"
          }
          trap cleanup EXIT

          echo "Checking GitHub Secrets..."

          if [ -z "$P12_BASE64" ]; then
            echo "ERROR: LINPAD_P12_BASE64 is empty."
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERROR: LINPAD_P12_PASSWORD is empty."
            exit 1
          fi

          if [ -z "$PROFILE_BASE64" ]; then
            echo "ERROR: LINPAD_PROVISION_PROFILE_BASE64 is empty."
            exit 1
          fi

          echo "Decoding certificate..."
          printf '%s' "$P12_BASE64" | base64 -D -o "$CERTIFICATE"

          echo "Decoding provisioning profile..."
          printf '%s' "$PROFILE_BASE64" | base64 -D -o "$PROFILE"

          echo
          echo "Certificate file size:"
          wc -c "$CERTIFICATE"

          echo "Certificate SHA-256:"
          shasum -a 256 "$CERTIFICATE"

          echo
          echo "Provisioning profile file size:"
          wc -c "$PROFILE"

          echo
          echo "Step 1: Validate certificate and password with OpenSSL..."

          if openssl pkcs12 \
            -in "$CERTIFICATE" \
            -passin env:P12_PASSWORD \
            -info -noout >/dev/null 2>&1; then
            echo "SUCCESS: OpenSSL validated the certificate password."
          else
            echo "ERROR: OpenSSL could not validate the certificate password."
            exit 1
          fi

          echo
          echo "Step 2: Create temporary keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo
          echo "Step 3: Import certificate into macOS..."

          if security import "$CERTIFICATE" \
            -P "$P12_PASSWORD" \
            -k "$KEYCHAIN"; then
            echo "SUCCESS: macOS imported the certificate."
          else
            echo "ERROR: macOS certificate import failed."
            echo "OpenSSL validation succeeded, so check password handling and PKCS#12 compatibility."
            exit 1
          fi

          echo
          echo "Step 4: Check code-signing identities..."

          security find-identity -v -p codesigning "$KEYCHAIN"

          echo
          echo "Step 5: Validate provisioning profile..."

          security cms -D \
            -i "$PROFILE" \
            -o "$PROFILE_PLIST"

          echo "Provisioning profile app identifier:"
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$PROFILE_PLIST"

          echo "Provisioning profile team:"
          /usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' \
            "$PROFILE_PLIST"

          echo
          echo "SUCCESS: All signing-file checks passed."

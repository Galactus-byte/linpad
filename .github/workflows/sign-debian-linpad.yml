
name: Check LinPad Signing Files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-signing:
    runs-on: macos-26
    steps:
      - name: Check certificate and provisioning profile
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$P12_BASE64" \
            | base64 -D -o "$RUNNER_TEMP/certificate.p12"

          printf '%s' "$PROFILE_BASE64" \
            | base64 -D -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$P12_PASSWORD" \
            -k "$KEYCHAIN" \
            -T /usr/bin/codesign

          echo "Checking signing identities..."
          security find-identity -v -p codesigning "$KEYCHAIN"

          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            -o "$RUNNER_TEMP/profile.plist"

          echo "Provisioning profile app identifier:"
          /usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:application-identifier' \
            "$RUNNER_TEMP/profile.plist"

          echo "Provisioning profile team:"
          /usr/libexec/PlistBuddy \
            -c 'Print :TeamIdentifier:0' \
            "$RUNNER_TEMP/profile.plist"

          security delete-keychain "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/certificate.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist"

          echo "Signing-file checks completed."

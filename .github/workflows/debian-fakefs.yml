
name: Build Debian LinPad Filesystem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    timeout-minutes: 45

    steps:
      - name: Checkout LinPad
        uses: useblacksmith/checkout@v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build gcc g++ pkgconf \
            libarchive-dev libsqlite3-dev \
            debootstrap debian-archive-keyring

      - name: Configure LinPad tools
        run: |
          rm -rf build-port
          meson setup build-port \
            -Dguest_arch=arm64 \
            -Dkernel=ish

      - name: Build fakefsify
        run: ninja -C build-port tools/fakefsify

      - name: Create Debian ARM64 archive
        run: |
          sudo debootstrap \
            --arch=arm64 \
            --variant=minbase \
            trixie \
            "$RUNNER_TEMP/debian-rootfs" \
            https://deb.debian.org/debian

          sudo tar --numeric-owner \
            -czf "$RUNNER_TEMP/debian-rootfs.tar.gz" \
            -C "$RUNNER_TEMP/debian-rootfs" .

      - name: Convert Debian to LinPad fakefs
        run: |
          build-port/tools/fakefsify \
            "$RUNNER_TEMP/debian-rootfs.tar.gz" \
            "$RUNNER_TEMP/debian-arm64-fakefs"

          test -d "$RUNNER_TEMP/debian-arm64-fakefs"

          tar --numeric-owner \
            -czf "$RUNNER_TEMP/debian-arm64-fakefs.tar.gz" \
            -C "$RUNNER_TEMP" debian-arm64-fakefs

      - name: Upload converted filesystem
        uses: actions/upload-artifact@v4
        with:
          name: debian-arm64-linpad-fakefs
          path: ${{ runner.temp }}/debian-arm64-fakefs.tar.gz
          if-no-files-found: error
          retention-days: 7

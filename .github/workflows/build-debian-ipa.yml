
name: Build Debian LinPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LinPad ARM64
    runs-on: blacksmith-12vcpu-macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout LinPad
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-v1
          restore-keys: |
            macos-15-homebrew-

      - name: Install build tools
        run: |
          brew install meson ninja llvm lld libarchive sqlite

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$P12_BASE64" | base64 -D > "$CERT"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

          rm -f "$CERT"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo "$PROFILE_BASE64" | base64 -D > "$PROFILE"

          security cms -D \
            -i "$PROFILE" \
            > "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' \
            "$RUNNER_TEMP/profile.plist")

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Provisioning profile installed."
          

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: macos-15-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            macos-15-spm-

      - name: Allow Swift package macros
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipPackagePluginFingerprintValidation \
            -bool YES
          echo "Xcode package macro validation setting applied."

      - name: Locate Perception package
        run: |
          echo "Searching Swift package cache..."
          find "$RUNNER_TEMP/SourcePackages" "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/swift-perception/Package.swift' \
            -print 2>/dev/null || true

      - name: Check Xcode and Swift versions
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Swift ==="
          swift --version
          echo "=== Active developer directory ==="
          xcode-select -p

      - name: Diagnose Swift package resolution
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project iSH.xcodeproj \
            -target iSH-ARM64 \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tee "$RUNNER_TEMP/package-resolution.log"

      - name: Diagnose Perception macro build settings
        run: |
          set -o pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -target iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -showBuildSettings 2>&1 |
            grep -E 'SWIFT_VERSION|SDKROOT|BUILT_PRODUCTS_DIR|BUILD_DIR|SYMROOT|OBJROOT|TOOLCHAINS' || true

      - name: Check Swift macro build environment
        run: |
          echo "=== Host architecture ==="
          uname -m
          echo "=== Swift compiler ==="
          xcrun swiftc --version
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Resolved Perception dependency ==="
          grep -n -A 8 -B 3 'swift-perception' desktop/DesktopKit/Package.resolved || true

      - name: Inspect Perception macro target settings
        run: |
          echo "=== Perception macro target settings ==="
          xcodebuild \
            -project iSH.xcodeproj \
            -target iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings 2>&1 |
            grep -E 'SWIFT_EXEC|SWIFT_VERSION|SDKROOT|PLATFORM_NAME|EFFECTIVE_PLATFORM_NAME|TARGET_BUILD_DIR|CONFIGURATION_BUILD_DIR|PerceptionMacros' |
            head -n 60 || true

      - name: Build ARM64 app
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"

          xcodebuild \
            -skipMacroValidation \
            -project iSH.xcodeproj \
            -scheme iSH-ARM64 \
            -configuration Release \
             -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            SYMROOT="$PWD/build-ios-release" \
            DEVELOPMENT_TEAM=FSZVB8ZXU6 \
            PRODUCT_BUNDLE_IDENTIFIER=com.Azor421757.Azor \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Azor_00008120-001168EE3A020032_1781726226" \
            PROVISIONING_PROFILE=fc2c7fbb-2cb0-4a77-8cc0-df9d1a43fe84 \
            build 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"




      - name: Diagnose Perception macro executable
        if: always()
        run: |
          echo "=== Looking for PerceptionMacros executable ==="
          find "$PWD/build-ios-release" "$PWD/build" "$RUNNER_TEMP/SourcePackages" \
            -type f -name 'PerceptionMacros' -print 2>/dev/null || true

          for f in \
            "$PWD/build-ios-release/Release-iphoneos/PerceptionMacros" \
            "$PWD/build/Release-iphoneos/PerceptionMacros"; do
            if [ -e "$f" ]; then
              echo "=== Found: $f ==="
              ls -l "$f"
              file "$f" || true
              echo "=== Launch test (first 20 lines) ==="
              "$f" 2>&1 | head -n 20 || true
            fi
          done

          echo "=== Related macro build products ==="
          find "$PWD/build-ios-release" "$PWD/build" \
            -iname '*Perception*' -print 2>/dev/null | head -n 80 || true

      - name: Inspect Swift macro plugin failure
        if: always()
        run: |
          echo "=== Host architecture ==="
          uname -m
          echo "=== Swift compiler ==="
          xcrun swiftc --version
          echo "=== Macro executable architecture ==="
          file "$PWD/build-ios-release/Release-iphoneos/PerceptionMacros" || true
          lipo -info "$PWD/build-ios-release/Release-iphoneos/PerceptionMacros" 2>&1 || true
          echo "=== Macro plugin errors in build log ==="
          grep -n -i -E 'malformed response|external macro implementation|error:|plugin.*(fail|error)' "$RUNNER_TEMP/xcode-build.log" | tail -n 15 || true

      - name: Upload build output for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linpad-build-log
          path: ${{ runner.temp }}/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7

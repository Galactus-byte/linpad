
name: Build Debian LinPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LinPad ARM64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout LinPad
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          brew install meson ninja llvm lld libarchive sqlite

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$P12_BASE64" | base64 -D > "$CERT"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

          rm -f "$CERT"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo "$PROFILE_BASE64" | base64 -D > "$PROFILE"

          security cms -D \
            -i "$PROFILE" \
            > "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' \
            "$RUNNER_TEMP/profile.plist")

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Provisioning profile installed."
          
      - name: Allow Swift package macros
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipPackagePluginFingerprintValidatation \
            -bool YES

          echo "Xcode package macro validation setting applied."

      - name: Test Perception macro plugin
        run: |
          set -euo pipefail

          PERCEPTION_DIR="$(find \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/SourcePackages/checkouts/swift-perception/Package.swift' \
            -print -quit)"

          if [ -z "$PERCEPTION_DIR" ]; then
            echo "Could not locate the swift-perception checkout."
            exit 1
          fi

          swift build \
            --package-path "$(dirname "$PERCEPTION_DIR")" \
            --target PerceptionMacros \
            -v
     
      - name: Upload build output for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linpad-build-log
          path: ${{ runner.temp }}/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7

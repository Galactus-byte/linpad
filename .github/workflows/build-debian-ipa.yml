
name: Build Debian LinPad IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LinPad ARM64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout LinPad
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: macos-15-homebrew-v1
          restore-keys: |
            macos-15-homebrew-

      - name: Install build tools
        run: |
          brew install meson ninja llvm lld libarchive sqlite

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.LINPAD_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LINPAD_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/linpad.keychain-db"
          CERT="$RUNNER_TEMP/certificate.p12"

          echo "$P12_BASE64" | base64 -D > "$CERT"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"

          security import "$CERT" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -f pkcs12

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "" "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"

          echo "=== Available signing identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

          rm -f "$CERT"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.LINPAD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo "$PROFILE_BASE64" | base64 -D > "$PROFILE"

          security cms -D \
            -i "$PROFILE" \
            > "$RUNNER_TEMP/profile.plist"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print :UUID' \
            "$RUNNER_TEMP/profile.plist")

          cp "$PROFILE" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "Provisioning profile installed."
          

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: macos-15-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            macos-15-spm-

      - name: Allow Swift package macros
        run: |
          defaults write com.apple.dt.Xcode \
            IDESkipPackagePluginFingerprintValidation \
            -bool YES
          echo "Xcode package macro validation setting applied."

      - name: Build ARM64 app
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"

          xcodebuild \
            -skipMacroValidation \
            -project iSH.xcodeproj \
            -target iSH-ARM64 \
            -configuration Release \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            SYMROOT="$PWD/build-ios-release" \
            DEVELOPMENT_TEAM=FSZVB8ZXU6 \
            PRODUCT_BUNDLE_IDENTIFIER=com.Azor421757.Azor \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="Azor_00008120-001168EE3A020032_1781726226" \
            PROVISIONING_PROFILE=fc2c7fbb-2cb0-4a77-8cc0-df9d1a43fe84 \
            build 2>&1 | tee "$RUNNER_TEMP/xcode-build.log"




      - name: Upload build output for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linpad-build-log
          path: ${{ runner.temp }}/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7
